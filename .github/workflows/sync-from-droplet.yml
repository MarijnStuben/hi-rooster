name: Code ophalen van droplet

# Haalt de code die nu op de droplet draait op en zet die op deze branch,
# zodat GitHub weer gelijk loopt met de live app. Draait alleen als het
# commitbericht "[sync-droplet]" bevat. Database, .env en back-ups worden
# NIET opgehaald.
on:
  push:
    branches: ['claude/**']

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, '[sync-droplet]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: SSH instellen
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null

      - name: Code ophalen
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az \
            --exclude '.git/' --exclude '.github/' --exclude 'deploy/' \
            --exclude 'data/' --exclude 'backups/' --exclude 'node_modules/' \
            --exclude '.env*' --exclude '*.db' --exclude '*.db-*' --exclude '*.sqlite*' \
            --exclude '*.log' --exclude 'logs/' --exclude '*.pem' --exclude '*.key' \
            -e "ssh -i ~/.ssh/deploy_key" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/" ./
          git status --short

      - name: Opslaan op branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Geen verschillen met de droplet."
          else
            git commit -m "Code van droplet opgehaald (live versie)"
            git push
          fi
